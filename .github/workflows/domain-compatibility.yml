name: Domain compatibility

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  domain:
    name: Domain Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install domain test tools
        run: python -m pip install "pytest>=8.0" "pytest-cov>=5.0"
      - name: Test the domain without installing Streamlit
        run: >-
          python -m pytest
          tests/test_bins.py tests/test_alerts.py tests/test_routing.py
          tests/test_reports.py tests/test_system.py tests/test_smoke.py
          --cov=waste_mgmt.bins --cov=waste_mgmt.alerts
          --cov=waste_mgmt.routing --cov=waste_mgmt.reports
          --cov-branch --cov-fail-under=80 --cov-report=term-missing
          --cov-report=json:domain-coverage.json --junitxml=domain-tests.xml
      - name: Check statement and branch thresholds separately
        run: >-
          python -c "import json; from pathlib import Path;
          t = json.loads(Path('domain-coverage.json').read_text())['totals'];
          print(t);
          assert t['covered_lines'] * 100 >= 80 * t['num_statements'];
          assert t['covered_branches'] * 100 >= 80 * t['num_branches']"
      - name: Preserve version-specific evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: domain-python-${{ matrix.python-version }}
          path: |
            domain-tests.xml
            domain-coverage.json
          if-no-files-found: warn

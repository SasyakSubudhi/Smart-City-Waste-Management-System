name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4


      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        run: pytest --cov --cov-branch --cov-report=term-missing --cov-fail-under=80

      - name: Generate validation reports
        env:
          REPORT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python generate_reports.py

      - name: Upload Windows validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-validation-reports
          path: |
            docs/Unit_Test_Report.md
            docs/System_Validation_Report.md
            docs/Code_Coverage_Report.md
            docs/Branch_Coverage_Report.md
          if-no-files-found: error
